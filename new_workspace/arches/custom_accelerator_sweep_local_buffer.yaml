# TPU v4i LocalBuffer: 4MB total for 4 PEs = 1MB per PE, area = 5.1e-5 m²
# So area per bit = 5.1e-5 / (4MB * 8) = 5.1e-5 / 33554432 ≈ 1.52e-12 m²/bit
# We use this to scale LocalBuffer area with size.
# TPU v4i GlobalBuffer: 8MB, area = 1.12e-4 m²
# So area per bit = 1.12e-4 / (8MB * 8) = 1.12e-4 / 67108864 ≈ 1.67e-12 m²/bit

arch:
  extra_attributes_for_all_component_models: {tech_node: 16e-9}
  nodes:
  - !Memory
    name: MainMemory
    component_class: LPDDR4
    area: 0
    leak_power: 0
    actions:
    - {name: read,  energy: 8e-12,   latency: 1 / (8 * 19.2e9)}
    - {name: write, energy: 8e-12,   latency: 1 / (8 * 19.2e9)}
    size: inf
    tensors: {keep: ~Intermediates, may_keep: All}

  - !Memory
    name: GlobalBuffer
    size: {{GLB_KB}} * 1024 * 8
    area: 1.67e-12 * {{GLB_KB}} * 1024 * 8   # scaled from TPU v4i: 1.67e-12 m²/bit
    leak_power: 9.52e-6 * {{GLB_KB}} / 64    # scaled from Simba 64KB baseline
    total_latency: max(read_latency, write_latency)
    actions:
    - {name: read,  energy: 1.88e-12, latency: 1 / (64 * {{FREQ_GHZ}} * 1e9)}
    - {name: write, energy: 2.36e-12, latency: 1 / (64 * {{FREQ_GHZ}} * 1e9)}
    tensors: {keep: All}

  - !Container
    name: ProcessingElement
    spatial:
    - {name: reuse_input,  fanout: {{FANOUT_X}}, may_reuse: input,  reuse: input,  min_usage: 1}
    - {name: reuse_output, fanout: {{FANOUT_Y}}, may_reuse: output, reuse: output, min_usage: 1}

  - !Memory
    name: LocalBuffer
    size: {{LOCAL_KB}} * 1024 * 8
    area: 1.52e-12 * {{LOCAL_KB}} * 1024 * 8  # scaled from TPU v4i: 1.52e-12 m²/bit
    leak_power: 0
    actions:
    - {name: read,  energy: 2.49e-13, latency: 0}
    - {name: write, energy: 2.93e-13, latency: 0}
    tensors: {keep: weight}

  - !Memory
    name: Register
    size: weight.bits_per_value if weight else 1
    area: 0
    leak_power: 5e-6
    actions:
    - {name: read,  energy: 0, latency: 0}
    - {name: write, energy: 0, latency: 0}
    tensors: {keep: weight}

  - !Compute
    name: MAC
    component_class: IntMAC
    leak_power: 1.36e-6
    extra_attributes_for_component_model: {multiplier_width: 8, adder_width: 16}
