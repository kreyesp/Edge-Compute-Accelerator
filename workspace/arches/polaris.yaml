### TENSTORRENT POLARIS ARCHITECTURE - GRENDEL Q2_A2 CONFIGURATION
### Converted to AccelForge Hierarchical Format

arch:
  nodes:
  # Root Level: Main Memory (GDDR7 from Q2_A2 package)
  - !Memory
    name: GDDR7_MainMemory
    # Size: 2GB per unit * 24 units = 48GB. Leaving as inf for standard AccelForge flow unless strict capacity is needed.
    size: inf 
    leak_power: 0
    actions:
      # GDDR7 Bandwidth calculation: 40.0 GT/s * 32 bits (4 bytes) * 24 units.
      - {name: read, energy: 0, latency: 1 / (24 * 40e9 * 4)}
      - {name: write, energy: 0, latency: 1 / (24 * 40e9 * 4)}
    tensors: {keep: ~Intermediates, may_keep: All}

  # Level 1: Tensix Core Array
  - !Container
    name: Tensix_Array
    spatial:
      # The Q2_A2 package instantiates 64 Tensix compute units.
      - {name: core_id, fanout: 64, may_reuse: input, reuse: input, min_usage: 1}

  # Level 2: Tensix L2 Cache (Shared within the core)
  - !Memory
    name: Tensix_L2_Cache
    size: inf
    leak_power: 0
    actions:
      # L2 Bandwidth: 64 banks * 64 bytes_per_clk_per_bank * 1200 MHz (Q2_A2 clock speed)
      - {name: read, energy: 0, latency: 1 / (64 * 64 * 1200e6)}
      - {name: write, energy: 0, latency: 1 / (64 * 64 * 1200e6)}
    tensors: {keep: All}

  # Level 3: Execution Pipes (Branching into Matrix and Vector logic)
  - !Fork
    nodes:
      
      # ---------------------------------------------------------
      # BRANCH 1: Matrix Pipe
      # ---------------------------------------------------------
      - !Container
        name: Matrix_Pipe_Array
        spatial:
          # Tensix IP defines 4 matrix units per core.
          - {name: matrix_unit, fanout: 4, may_reuse: input}

      - !Compute
        name: Matrix_MAC
        leak_power: 0
        actions:
          # Throughput: 2048 ops (fp16/bf16/int8) per clock at 1200 MHz
          - {name: compute, energy: 0, latency: 1 / (2048 * 1200e6)}

      # ---------------------------------------------------------
      # BRANCH 2: Vector Pipe
      # ---------------------------------------------------------
      - !Container
        name: Vector_Pipe_Array
        spatial:
          # Tensix IP defines 4 vector units per core.
          - {name: vector_unit, fanout: 4, may_reuse: input}

      - !Compute
        name: Vector_ALU
        leak_power: 0
        actions:
          # Throughput: 128 ops (mac/add/sub) per clock at 1200 MHz
          - {name: compute, energy: 0, latency: 1 / (128 * 1200e6)}